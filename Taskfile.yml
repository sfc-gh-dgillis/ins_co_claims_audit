version: '3'

includes:
  validate-prerequisites:
    taskfile: ./tasks/validate-prerequisites/validate-prerequisite-tasks.yml
    internal: true
  snow-cli:
    taskfile: ./tasks/snow-cli/snowcli-tasks.yml
    dir: ./tasks/snow-cli
    internal: true
  python:
    taskfile: ./tasks/python/python-tasks.yml
    internal: true

env:
  ENV_DIR: .env

dotenv: ['{{ .ENV_DIR }}/{{ .DOTENV_FILENAME | default "demo.env" }}']

tasks:

  python-setup-for-agents:
    internal: true
    desc: Setup Python environment with required packages for agent tasks.
    cmds:
      - task: python:create-venv
      - task: python:install-packages

  demo-init:
    desc: |
      Usage: `task demo-init` deploys the DCM project in tasks/snow-cli/dcm (warehouse, roles, database,
        schema, stage, tables, functions, semantic view, grants). It runs pre_deploy.sql, shows the plan,
        asks before deploying, then applies post_deployment_grants.sql. Run it with ACCOUNTADMIN
        (DOTENV_FILENAME=demo_admin.env task demo-init).
    preconditions:
      - sh: snow sql --connection "$CLI_CONNECTION_NAME" -q "USE ROLE ACCOUNTADMIN" > /dev/null 2>&1
        msg: |
          Connection '{{.CLI_CONNECTION_NAME}}' can't use the ACCOUNTADMIN role, which demo-init needs.
          Run it with the admin env file instead: DOTENV_FILENAME=demo_admin.env task demo-init
    cmds:
      - task: validate-prerequisites:snowcli
        silent: true

      - task: snow-cli:sort-and-process-sql-folder
        vars:
          SQL_SORT_PROCESS_DIR: sql/dcm-pre-deploy
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME

      - task: snow-cli:dcm-plan
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME

      - task: snow-cli:dcm-deploy
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME

      - task: snow-cli:sort-and-process-sql-folder
        vars:
          SQL_SORT_PROCESS_DIR: sql/dcm-post-deploy
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME

  demo-up:
    desc: |
      Usage: `task demo-up` if using the default demo.env file. Use `DOTENV_FILENAME=custom.env task demo-up`
      if using a custom .env file (filename does not have to be custom.env, but must end with .env).

    cmds:
      - task: validate-prerequisites:snowcli
        silent: true

      - task: snow-cli:upload-files-to-internal-named-stage
        vars:
          FILE_UPLOAD_DIR: $FILE_UPLOAD_DIR
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          INTERNAL_NAMED_STAGE: $INTERNAL_NAMED_STAGE

      - task: snow-cli:sort-and-process-sql-folder
        vars:
          SQL_SORT_PROCESS_DIR: sql/batch-2
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME

      - task: snow-cli:create-agent
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME

      - task: snow-cli:generate-streamlit-project
        vars:
          STREAMLIT_APP_DIR: $STREAMLIT_APP_DIR

      - task: snow-cli:deploy-streamlit-app
        vars:
          STREAMLIT_APP_DIR: $STREAMLIT_APP_DIR
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME

      - task: snow-cli:sort-and-process-sql-folder
        vars:
          SQL_SORT_PROCESS_DIR: sql/streamlit-post-deploy
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME

  sync-agents:
    desc: |
      Usage: `task sync-agents` will regenerate the agent SQL from what is stored in the database. It
        will then update the agent with the new SQL. This is useful if you have made changes to the agent
        in the UI and want to sync those changes back to your local files for version control.

    cmds:
      - task: validate-prerequisites:snowcli
        silent: true

      - task: snow-cli:generate-agent-sql
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME

      - task: snow-cli:create-agent
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME

  sync-workspace:
    desc: |
      Usage: `DOTENV_FILENAME=demo_admin.env task sync-workspace` copies the repo's git-tracked files into the
        private workspace USER$.PUBLIC.INS_CO_CLAIMS_AUDIT (override with WORKSPACE_NAME=...). A workaround until
        the workspace is git-synced: the workspace is recreated on every run, so edits made in it are lost.
        USER$ is the connection user's personal database, so run it as yourself (demo_admin.env), not the
        service user in demo.env.
    prompt: Recreate the workspace? Edits made in it since the last sync will be lost.
    cmds:
      - task: validate-prerequisites:snowcli
        silent: true

      - task: snow-cli:sync-workspace
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          WORKSPACE_NAME: '{{.WORKSPACE_NAME}}'

  demo-teardown:
    desc: |
      Usage: `task demo-teardown` removes everything demo-init and demo-up created. It runs pre_purge.sql
        (unregisters the agent from Snowflake Intelligence), asks before running `snow dcm purge` (drops the
        database, warehouse, roles and grants the DCM project manages), then runs post_purge.sql (drops the
        Streamlit compute pool). The DCM project itself is kept, so demo-init can redeploy into it. Run it with
        ACCOUNTADMIN (DOTENV_FILENAME=demo_admin.env task demo-teardown).
    preconditions:
      - sh: snow sql --connection "$CLI_CONNECTION_NAME" -q "USE ROLE ACCOUNTADMIN" > /dev/null 2>&1
        msg: |
          Connection '{{.CLI_CONNECTION_NAME}}' can't use the ACCOUNTADMIN role, which demo-teardown needs.
          Run it with the admin env file instead: DOTENV_FILENAME=demo_admin.env task demo-teardown
    cmds:
      - task: validate-prerequisites:snowcli
        silent: true

      - task: snow-cli:sort-and-process-sql-folder
        vars:
          SQL_SORT_PROCESS_DIR: sql/dcm-pre-purge
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME

      - task: snow-cli:dcm-purge
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME

      - task: snow-cli:sort-and-process-sql-folder
        vars:
          SQL_SORT_PROCESS_DIR: sql/dcm-post-purge
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
